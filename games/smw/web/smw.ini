[General]
Autosave = 0
DisableFrameDelay = 0
SavePlaythrough = 0
[Graphics]
WindowSize = Auto
Fullscreen = 0
WindowScale = 1
NewRenderer = 1
IgnoreAspectRatio = 1
NoSpriteLimits = 1
OutputMethod = SDL
[Sound]
EnableAudio = 1
AudioFreq = 32000
AudioChannels = 2
AudioSamples = 1024
[KeyMap]
Controls = Up, Down, Left, Right, Right Shift, Return, x, z, s, a, c, v
[GamepadMap]
EnableGamepad1 = true
EnableGamepad2 = true
Controls =   DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
ControlsP2 = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
